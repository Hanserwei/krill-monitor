name: CI and APK release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.cache/ms-playwright
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-kotlin-${{ hashFiles('kotlin', '**/module.yaml', 'libs.versions.toml') }}
      - name: Install Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-37 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - name: Build Android and Web
        run: ./kotlin build
      - name: Test Android
        run: ./kotlin test -m shared --platform android
      - name: Test Web
        run: ./kotlin test -m shared --platform wasmJs
      - name: Test account proxy and release validation
        run: |
          node --test tools/account-web.test.mjs tools/release-apk.test.mjs
          bash -n tools/release-apk.sh
          git diff --check
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug
          path: build/tasks/_androidApp_buildAndroidDebug/gradle-project-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.cache/ms-playwright
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-kotlin-${{ hashFiles('kotlin', '**/module.yaml', 'libs.versions.toml') }}
      - name: Install Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-37 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - name: Build and sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/krill-monitor-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          tools/release-apk.sh "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/krill-monitor-${GITHUB_REF_NAME#v}.apk" \
            dist/SHA256SUMS dist/ANDROID-SIGNING-CERT.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Krill Monitor $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
