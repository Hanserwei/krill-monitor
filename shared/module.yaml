product:
  type: kmp/lib
  platforms: [ android, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  # Ktor 3.4 的 Wasm 引擎已包含在 core 中。
  - $libs.ktor.client.core
  - $libs.kotlinx.serialization.json
  - $libs.kotlinx.coroutines.core

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.okhttp

test-dependencies:
  - $libs.ktor.client.mock
  - $libs.kotlinx.coroutines.test

settings:
  compose:
    enabled: true
    resources:
      packageName: com.hanserwei.krill_monitor.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
